{% extends "base.html" %}
{% block titulo %}Editar nota{% endblock %}
{% block conteudo %}
<p class="trilha"><a href="/analises/{{ analise_id }}/notas">Notas</a> / Editar</p>
<section class="cartao">
  <h1>Editar nota</h1>
  <form method="post" action="/notas/{{ nota.id }}" class="grade">
    <label>Nota <textarea name="texto" rows="4" required>{{ nota.texto }}</textarea></label>
    <button class="botao primario">Salvar</button>
  </form>
</section>
{% endblock %}
