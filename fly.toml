app = "driftor-reuso"
primary_region = "gru"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/papeis"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
