name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -q -f backend/pom.xml -DskipTests package
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r motor/requirements.txt pytest httpx
      - run: cd motor && pytest -q -p no:warnings

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a driftor-reuso --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: acorda o app e confere o banco
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 -H "Papel: gestor" https://driftor-reuso.fly.dev/api/processos \
            || (flyctl logs -a driftor-reuso --no-tail | tail -80; exit 1)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
